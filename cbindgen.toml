# Configuration for the C header consumed by Overleash via cgo.
#
# Regenerate with:
#   cbindgen --config cbindgen.toml --lang c --crate frontendengine \
#            --output frontend_engine.h
#
# CI regenerates the header and fails if it differs from the committed copy, so
# that a signature change cannot reach Go as a silent ABI mismatch.

language = "C"
include_guard = "FRONTEND_ENGINE_H"
tab_width = 4
documentation = true
documentation_style = "doxy"

header = """
/* Generated by cbindgen from the frontendengine crate. Do not edit by hand.
 *
 * Memory ownership:
 *   new_engine()            -> free_engine()
 *   take_state()            -> free_response()
 *   resolve(), resolve_all() -> free_rust_buffer(ptr, len)
 *
 * resolve() and resolve_all() return NULL and write 0 to out_len on failure.
 */
"""

[defines]

[export]
prefix = ""

# Note: cbindgen prints one harmless warning while parsing the private
# `RwLock<EngineState>` type alias, which it cannot mangle. Nothing is missing
# from the output — the engine crosses the boundary as an opaque `void *`.

[parse]
parse_deps = false
